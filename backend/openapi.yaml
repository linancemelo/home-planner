openapi: 3.1.0
info:
  title: Home Planner Detect API
  version: 0.2.0
  description: |
    Floor-plan image → structured detect JSON.
    Modes via env `DETECT_MODE=mock|yolo` (default mock). YOLO path uses
    ultralytics seg + OpenCV post-process; falls back to mock if model missing.

    Units: **metres**. Coordinate origin: **bottom-left** (Y-up), matching
    frontend `Floorplan` / `src/import-plan/floorplan.ts`.
servers:
  - url: http://127.0.0.1:8000
    description: Local detect API
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  mode: { type: string, enum: [mock, yolo], example: mock }
  /api/v1/detect:
    post:
      summary: Detect walls/doors/windows/rooms from floor-plan image
      operationId: detectFloorplan
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG/JPEG floor-plan image
      responses:
        "200":
          description: Full structured detect result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectResponse"
              examples:
                mock:
                  $ref: "#/components/examples/MockDetect"
        "400":
          description: Bad request
        "415":
          description: Unsupported media type
components:
  schemas:
    Vec2:
      type: object
      required: [x, y]
      properties:
        x: { type: number, description: metres }
        y: { type: number, description: metres }
    Segment:
      type: object
      required: [a, b]
      properties:
        a: { $ref: "#/components/schemas/Vec2" }
        b: { $ref: "#/components/schemas/Vec2" }
    Wall:
      type: object
      required: [id, a, b, thicknessM]
      properties:
        id: { type: string }
        a: { $ref: "#/components/schemas/Vec2" }
        b: { $ref: "#/components/schemas/Vec2" }
        thicknessM: { type: number, exclusiveMinimum: 0 }
        thicknessAssumed: { type: boolean }
        heightM: { type: number, exclusiveMinimum: 0 }
    Door:
      type: object
      required: [id, kind, wallId, opening]
      properties:
        id: { type: string }
        kind: { type: string, enum: [swing, sliding] }
        wallId: { type: string }
        opening: { $ref: "#/components/schemas/Segment" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        swing:
          type: object
          properties:
            hinge: { $ref: "#/components/schemas/Vec2" }
            leafLengthM: { type: number }
            openDirection: { type: string, enum: [cw, ccw] }
            arcQuarter: { type: boolean, const: true }
        sliding:
          type: object
          properties:
            leafA: { $ref: "#/components/schemas/Segment" }
            leafB: { $ref: "#/components/schemas/Segment" }
    Window:
      type: object
      required: [id, wallId, opening]
      properties:
        id: { type: string }
        wallId: { type: string }
        opening: { $ref: "#/components/schemas/Segment" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        sillHeightM: { type: number, minimum: 0 }
        sillHeightAssumed: { type: boolean }
    Room:
      type: object
      required: [id, type, vertices]
      properties:
        id: { type: string }
        type:
          type: string
          description: Room type / label (e.g. 客廳, 臥室) — Traditional Chinese preferred
        vertices:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/Vec2" }
          description: Polygon in metres, bottom-left origin, CCW preferred
        confidence: { type: number, minimum: 0, maximum: 1 }
    DetectMeta:
      type: object
      required:
        - sourceName
        - imageWidthPx
        - imageHeightPx
        - metersPerPixel
        - scaleTrusted
        - coordinateOrigin
        - ceilingHeightM
        - ceilingHeightAssumed
      properties:
        sourceName: { type: string }
        imageWidthPx: { type: integer, exclusiveMinimum: 0 }
        imageHeightPx: { type: integer, exclusiveMinimum: 0 }
        metersPerPixel: { type: number, exclusiveMinimum: 0 }
        scaleTrusted: { type: boolean, const: false }
        coordinateOrigin: { type: string, enum: [bottom-left, top-left] }
        ceilingHeightM: { type: number }
        ceilingHeightAssumed: { type: boolean, const: true }
        detectionConfidence: { type: number, minimum: 0, maximum: 1 }
        units: { type: string, enum: [meters], default: meters }
        notes:
          type: array
          items: { type: string }
    DetectResponse:
      type: object
      required: [version, kind, meta, walls, doors, windows, rooms]
      properties:
        version: { type: integer, const: 1 }
        kind: { type: string, const: detect-result }
        meta: { $ref: "#/components/schemas/DetectMeta" }
        walls:
          type: array
          items: { $ref: "#/components/schemas/Wall" }
        doors:
          type: array
          items: { $ref: "#/components/schemas/Door" }
        windows:
          type: array
          items: { $ref: "#/components/schemas/Window" }
        rooms:
          type: array
          items: { $ref: "#/components/schemas/Room" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        notes:
          type: array
          items: { type: string }
        mock: { type: boolean, description: true when mock path used; false for YOLO }
        mode: { type: string, enum: [mock, yolo], description: Detection path used }
